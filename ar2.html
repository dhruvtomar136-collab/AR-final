<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;}

    #overlay{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0.5);}
    #overlay.show{display:flex;}
    #panel{
      width:100%;max-width:480px;background:#fff;color:#222;
      border-radius:18px 18px 0 0;padding:22px 20px 28px;position:relative;
      transform:translateY(100%);transition:transform .3s ease;
      box-shadow:0 -8px 30px rgba(0,0,0,0.35);
    }
    #overlay.show #panel{transform:translateY(0);}
    #panel .eyebrow{font-size:11px;letter-spacing:2px;color:#c81e3a;text-transform:uppercase;font-weight:bold;}
    #panel h2{font-size:22px;margin:6px 0 10px;}
    #panel p{font-size:15px;line-height:1.55;color:#333;margin:0 0 8px;}
    #panel .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
    #panel .tags span{font-size:10px;letter-spacing:0.5px;background:#f0eae5;color:#8a1129;padding:5px 10px;border-radius:999px;text-transform:uppercase;}
    #closeBtn{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;border:none;background:#eee;font-size:16px;cursor:pointer;}
  </style>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"
      cursor="rayOrigin: mouse; fuse:false" raycaster="objects: .clickable; far: 20"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Replace with your actual 3D model URL -->
      <a-gltf-model src="realistic_human_heart(1).glb" scale="0.5 0.5 0.5" position="0 0 0"></a-gltf-model>

      <!-- tappable info hotspots, positioned around the heart model -->
      <a-entity class="clickable" data-part="svc" position="0.075 0.325 0.15">
        <a-circle radius="0.02" color="#c81e3a" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="900" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="aorta" position="0.025 0.36 0.075">
        <a-circle radius="0.02" color="#c81e3a" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="1000" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="pulmonary_artery" position="-0.125 0.3 0.1">
        <a-circle radius="0.02" color="#3a6fb5" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="1100" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="right_atrium" position="0.175 0.16 0.14">
        <a-circle radius="0.02" color="#c81e3a" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="1050" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="left_atrium" position="-0.15 0.175 0.075">
        <a-circle radius="0.02" color="#c81e3a" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="900" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="valves" position="0 0.025 0.19">
        <a-circle radius="0.018" color="#e8c07d" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#2b2622" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="1000" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="right_ventricle" position="0.15 -0.125 0.14">
        <a-circle radius="0.022" color="#8f1128" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="1100" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="left_ventricle" position="-0.125 -0.15 0.11">
        <a-circle radius="0.022" color="#8f1128" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="950" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

      <a-entity class="clickable" data-part="septum" position="0 -0.175 0.175">
        <a-circle radius="0.018" color="#5c0a1c" material="shader:flat"></a-circle>
        <a-text value="i" align="center" color="#fff" width="1" position="0 0 0.005" scale="0.25 0.25 0.25"></a-text>
        <a-animation attribute="scale" dur="1000" direction="alternate" repeat="indefinite" to="1.3 1.3 1.3"></a-animation>
      </a-entity>

    </a-entity>
  </a-scene>

  <div id="overlay">
    <div id="panel">
      <button id="closeBtn">✕</button>
      <div class="eyebrow" id="panelEyebrow">HEART ANATOMY</div>
      <h2 id="panelTitle">Part name</h2>
      <p id="panelInfo">Info text.</p>
      <div class="tags" id="panelTags"></div>
    </div>
  </div>

  <script>
    const HEART_DATA = {
      svc: { eyebrow:"GREAT VESSEL", title:"Superior Vena Cava", info:"The large vein that collects deoxygenated blood from the head, neck and arms and empties it into the right atrium.", tags:["Vein","Deoxygenated blood"] },
      aorta: { eyebrow:"GREAT VESSEL", title:"Aorta", info:"The body's largest artery. It carries oxygen-rich blood from the left ventricle out to the entire body.", tags:["Artery","Oxygenated blood"] },
      pulmonary_artery: { eyebrow:"GREAT VESSEL", title:"Pulmonary Artery", info:"Carries deoxygenated blood from the right ventricle to the lungs to pick up fresh oxygen — the only artery carrying low-oxygen blood.", tags:["Artery","To lungs"] },
      right_atrium: { eyebrow:"CHAMBER", title:"Right Atrium", info:"The upper-right chamber that receives deoxygenated blood returning from the body, then pushes it into the right ventricle.", tags:["Upper chamber","Receiving"] },
      left_atrium: { eyebrow:"CHAMBER", title:"Left Atrium", info:"The upper-left chamber that receives freshly oxygenated blood from the lungs and passes it down into the left ventricle.", tags:["Upper chamber","Receiving"] },
      right_ventricle: { eyebrow:"CHAMBER", title:"Right Ventricle", info:"The lower-right chamber that pumps deoxygenated blood into the pulmonary artery and onward to the lungs.", tags:["Lower chamber","Pumping"] },
      left_ventricle: { eyebrow:"CHAMBER", title:"Left Ventricle", info:"The thickest, most muscular chamber — it pumps oxygen-rich blood into the aorta with enough force to reach the entire body.", tags:["Lower chamber","Strongest wall"] },
      septum: { eyebrow:"STRUCTURE", title:"Septum", info:"The muscular wall dividing the heart's left and right sides, keeping oxygenated and deoxygenated blood from mixing.", tags:["Muscle wall","Divider"] },
      valves: { eyebrow:"STRUCTURE", title:"Heart Valves", info:"One-way gates (mitral, tricuspid, aortic, pulmonary) that snap open and shut with every beat to keep blood flowing in only one direction.", tags:["Mitral","Tricuspid","Aortic","Pulmonary"] }
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.clickable').forEach(el => {
        el.addEventListener('click', () => openPanel(el.dataset.part));
      });
    });

    function openPanel(part){
      const d = HEART_DATA[part];
      if(!d) return;
      document.getElementById('panelEyebrow').textContent = d.eyebrow;
      document.getElementById('panelTitle').textContent = d.title;
      document.getElementById('panelInfo').textContent = d.info;
      const tagsEl = document.getElementById('panelTags');
      tagsEl.innerHTML = '';
      d.tags.forEach(t => {
        const s = document.createElement('span');
        s.textContent = t;
        tagsEl.appendChild(s);
      });
      document.getElementById('overlay').classList.add('show');
    }
    document.getElementById('closeBtn').addEventListener('click', () => document.getElementById('overlay').classList.remove('show'));
    document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') e.target.classList.remove('show'); });
  </script>
</body>
</html>
