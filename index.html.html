<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  #info-panel {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: Arial, sans-serif;
  }
  #info-content {
    background: #fff;
    color: #000;
    max-width: 90%;
    max-height: 80%;
    padding: 20px;
    border-radius: 10px;
    overflow: auto;
    position: relative;
  }
  #close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 22px;
    cursor: pointer;
    user-select: none;
  }
  .part-btn {
    margin: 4px;
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    background: #3b82f6;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .part-btn:hover {
    background: #2563eb;
  }
</style>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Replace with your actual 3D model URL -->
      <a-gltf-model src="realistic_human_heart(1).glb" scale="0.5 0.5 0.5" position="0 0 0"></a-gltf-model>
    </a-entity>
  </a-scene>
<div id="info-panel">
  <div id="info-content">
    <span id="close-btn">&times;</span>
    <h2 id="info-title">Heart Part Info</h2>
    <div id="info-text"></div>
    <div style="margin-top:12px;">
      <button class="part-btn" data-part="aorta">Aorta</button>
      <button class="part-btn" data-part="ventricle">Ventricle</button>
      <button class="part-btn" data-part="atrium">Atrium</button>
      <!-- Add more parts as needed -->
    </div>
  </div>
</div>
<script>
  const infoPanel = document.getElementById('info-panel');
  const infoText = document.getElementById('info-text');
  const infoTitle = document.getElementById('info-title');
  const closeBtn = document.getElementById('close-btn');

  const partInfo = {
    aorta: {
      title: "Aorta",
      text: "The aorta is the main artery that carries oxygen-rich blood from the left ventricle to the rest of the body."
    },
    ventricle: {
      title: "Ventricle",
      text: "The ventricles are the lower chambers of the heart. The left ventricle pumps blood to the body; the right ventricle pumps blood to the lungs."
    },
    atrium: {
      title: "Atrium",
      text: "The atria are the upper chambers of the heart. The right atrium receives oxygen-poor blood from the body; the left atrium receives oxygen-rich blood from the lungs."
    }
    // Add more parts here
  };

  function showInfo(partKey) {
    const data = partInfo[partKey];
    if (!data) return;
    infoTitle.textContent = data.title;
    infoText.textContent = data.text;
    infoPanel.style.display = 'flex';
  }

  closeBtn.addEventListener('click', () => {
    infoPanel.style.display = 'none';
  });

  infoPanel.addEventListener('click', (e) => {
    if (e.target === infoPanel) {
      infoPanel.style.display = 'none';
    }
  });

  document.querySelectorAll('.part-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const part = btn.getAttribute('data-part');
      showInfo(part);
    });
  });

  // Optional: open info panel by clicking on the 3D model
  // You can attach this to a click/raycaster event in A-Frame if you want.
</script>
</body>
</html>
