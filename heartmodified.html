<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    #info-popup {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      max-width: 85%;
      font-family: Arial, sans-serif;
      font-size: 16px;
      z-index: 999;
    }
    #close-popup {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-cursor raycaster="objects: .clickable" cursor="rayOrigin: mouse; fuse: false"></a-cursor>
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Replace with your actual 3D model URL -->
      <a-gltf-model src="./realistic_human_heart(1).glb" scale="0.5 0.5 0.5" position="0 0 0"></a-gltf-model>

      <!-- Clickable hotspots for each heart part -->
      <a-sphere class="clickable" data-info="Right Atrium: Receives deoxygenated blood from the body via the vena cava."
        position="0.3 0.4 0.2" radius="0.05" color="#ff5566" opacity="0.6"></a-sphere>

      <a-sphere class="clickable" data-info="Left Ventricle: Pumps oxygenated blood out to the body through the aorta."
        position="-0.2 0.1 0.3" radius="0.05" color="#33aaff" opacity="0.6"></a-sphere>

      <a-sphere class="clickable" data-info="Aortic Valve: Prevents backflow of blood into the left ventricle."
        position="0 0.5 0" radius="0.05" color="#ffcc00" opacity="0.6"></a-sphere>
    </a-entity>

  </a-scene>

  <!-- Info popup overlay -->
  <div id="info-popup">
    <button id="close-popup">✕</button>
    <p id="info-text"></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const popup = document.getElementById('info-popup');
      const infoText = document.getElementById('info-text');
      const closeBtn = document.getElementById('close-popup');

      document.querySelectorAll('.clickable').forEach(el => {
        el.addEventListener('click', () => {
          infoText.textContent = el.getAttribute('data-info');
          popup.style.display = 'block';
        });
      });

      closeBtn.addEventListener('click', () => {
        popup.style.display = 'none';
      });
    });
  </script>
</body>
</html>
